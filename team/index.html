      // Apply the theme before first paint so nothing flashes the wrong palette.
      //
      // A saved choice always wins. With no saved choice the default follows
      // daylight in Karachi: light while the sun is up, dark once it has set.
      //
      // theme-boot:start - kept in sync with src/lib/daylight.js, and
      // scripts/verify-daylight.mjs fails the build if the two ever disagree.
      ;(function () {
        var ZONE_HOURS = 5,
          LAT = 24.8607,
          LNG = 67.0011,
          RAD = Math.PI / 180;

        function karachiThemeAt(instant) {
          var shifted = new Date(instant.getTime() + ZONE_HOURS * 3600000);
          var year = shifted.getUTCFullYear();
          var month = shifted.getUTCMonth() + 1;
          var day = shifted.getUTCDate();
          var hours =
            shifted.getUTCHours() +
            shifted.getUTCMinutes() / 60 +
            shifted.getUTCSeconds() / 3600;

          // Day of the year, 1-366.
          var doy =
            Math.floor((275 * month) / 9) -
            Math.floor((month + 9) / 12) *
              (1 + Math.floor((year - 4 * Math.floor(year / 4) + 2) / 3)) +
            day -
            30;

          var lngHour = LNG / 15;

          function eventHour(isSunrise) {
            var t = doy + ((isSunrise ? 6 : 18) - lngHour) / 24;
            var m = 0.9856 * t - 3.289;
            var l =
              m +
              1.916 * Math.sin(m * RAD) +
              0.02 * Math.sin(2 * m * RAD) +
              282.634;

            var ra = ((Math.atan(0.91764 * Math.tan(l * RAD)) / RAD) % 360 + 360) % 360;
            ra += Math.floor(l / 90) * 90 - Math.floor(ra / 90) * 90;
            ra /= 15;

            var cosDec = Math.cos(Math.asin(sinDec));
            var cosH =
              (Math.cos(90.833 * RAD) - sinDec * Math.sin(LAT * RAD)) /
              (cosDec * Math.cos(LAT * RAD));

            if (cosH < -1) return isSunrise ? 0 : 24;

            var h = Math.acos(cosH) / RAD;
            if (isSunrise) h = 360 - h;
            h /= 15;

            return ((utc + ZONE_HOURS) % 24 + 24) % 24;
          }

          var sunrise = eventHour(true);
          var sunset = eventHour(false);
          if (sunrise === null || sunset === null) return 'dark';
          return hours >= sunrise && hours < sunset ? 'light' : 'dark';
        }

        try {
          var saved = localStorage.getItem('theme');

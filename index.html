<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Muhammad Walid | Web Developer &amp; Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Muhammad Walid, a web developer building modern websites and web applications with React, Node.js and clean, user-focused design. Explore projects, services and get in touch."
    />
    <meta name="author" content="Muhammad Walid" />
    <link rel="canonical" href="https://mwalid.me/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#111111" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muhammad Walid — Portfolio" />
    <meta property="og:title" content="Muhammad Walid | Web Developer &amp; Portfolio" />
    <meta
      property="og:description"
      content="Muhammad Walid is a web developer building modern websites and web applications with React, Node.js and clean, user-focused design."
    />
    <meta property="og:url" content="https://mwalid.me/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Muhammad Walid | Web Developer &amp; Portfolio" />
    <meta
      name="twitter:description"
      content="Portfolio of Muhammad Walid — web developer building modern websites and web applications with React and Node.js."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: real, visible facts only -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://mwalid.me/#person",
            "name": "Muhammad Walid",
            "url": "https://mwalid.me/",
            "jobTitle": "Web Developer",
            "description": "Web developer building modern websites and web applications with a business-and-information-technology background.",
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "BBIT — Bachelor in Business & Information Technology"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://mwalid.me/#website",
            "url": "https://mwalid.me/",
            "name": "Muhammad Walid — Portfolio",
            "description": "Personal portfolio of Muhammad Walid, web developer.",
            "inLanguage": "en",
            "publisher": { "@id": "https://mwalid.me/#person" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
